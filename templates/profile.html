{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>Profile and settings</h1>
    <p class="muted">Updates are stored on the local demo student record in SQLite.</p>
  </div>
</section>
<form class="panel form-grid" method="post" novalidate data-validate="profile">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>
    Display name
    <input type="text" name="display_name" maxlength="80" required value="{{ form.get('display_name', student.display_name) }}">
  </label>
  <label>
    Learning track
    <select name="track" required>
      <option value="">Select a track</option>
      {% for track in tracks %}
        <option value="{{ track }}" {% if form.get('track') == track %}selected{% endif %}>{{ track }}</option>
      {% endfor %}
    </select>
  </label>
  <fieldset>
    <legend>Experience level</legend>
    {% for level in levels %}
      <label class="choice">
        <input type="radio" name="experience_level" value="{{ level }}" required {% if form.get('experience_level') == level %}checked{% endif %}>
        {{ level|capitalize }}
      </label>
    {% endfor %}
  </fieldset>
  <label>
    Daily available study time (minutes)
    <input type="number" name="daily_minutes" min="15" max="240" required value="{{ form.get('daily_minutes', 45) }}">
  </label>
  <label>
    Target duration (days)
    <input type="number" name="target_days" min="7" max="90" required value="{{ form.get('target_days', 14) }}">
  </label>
  <button class="btn btn-primary" type="submit">Save preferences</button>
</form>
{% endblock %}
